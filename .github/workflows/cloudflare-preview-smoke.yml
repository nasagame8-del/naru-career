name: Cloudflare Preview Smoke Test

on:
  push:
    branches:
      - infra/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://naru-career.evanescent-prepared.workers.dev

    steps:
      - name: Check public routes
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for path in / /about /articles /articles/agent-comparison-2026 /articles/agent-job-mismatch /articles/business-outsourcing-conversion-risk /articles/second-new-grad-web-marketing-career /robots.txt /sitemap.xml /shindan; do
            code="$(curl -L -sS -o /tmp/body -w '%{http_code}' "$PREVIEW_URL$path")"
            echo "$path -> $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Check homepage metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS "$PREVIEW_URL/" -o /tmp/home.html
          grep -qi '<title' /tmp/home.html
          grep -qi 'canonical' /tmp/home.html
          grep -qi 'naru-career.com' /tmp/home.html

      - name: Check robots and sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS "$PREVIEW_URL/robots.txt" -o /tmp/robots.txt
          curl -L -sS "$PREVIEW_URL/sitemap.xml" -o /tmp/sitemap.xml
          grep -q 'https://naru-career.com/sitemap.xml' /tmp/robots.txt
          grep -q 'https://naru-career.com/articles/' /tmp/sitemap.xml

      - name: Check protected internal API
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/internal -w '%{http_code}' "$PREVIEW_URL/internal/api")"
          echo "/internal/api -> $code"
          test "$code" = "401" || test "$code" = "503"

      - name: Check contact endpoint shape
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/contact -w '%{http_code}' "$PREVIEW_URL/api/contact")"
          echo "GET /api/contact -> $code"
          test "$code" = "405" || test "$code" = "404"
