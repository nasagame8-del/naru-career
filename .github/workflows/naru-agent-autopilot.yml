name: NARU Agent Autopilot

on:
  issue_comment:
    types: [created]

concurrency:
  group: naru-agent-autopilot
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  execute:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@naru-autopilot ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gate_run: ${{ steps.gate.outputs.run }}
      active_instruction: ${{ steps.gate.outputs.active }}

    steps:
      - name: Resolve control PR branch
        id: control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          test -n "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout control PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.control.outputs.branch }}
          fetch-depth: 0

      - name: Read autopilot state
        id: gate
        shell: bash
        env:
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
        run: |
          test -f docs/agent-handoff/NEXT_INSTRUCTION.md
          test -f docs/agent-handoff/STATE.json
          test -f docs/agent-handoff/REPORT.md
          test -f AGENTS.md

          STATUS="$(jq -r '.status // empty' docs/agent-handoff/STATE.json)"
          ACTIVE="$(jq -r '.instructionId // empty' docs/agent-handoff/STATE.json)"
          COMPLETED="$(sed -n 's/^- completedInstructionId: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          COMMENT_ID="$(printf '%s' "$TRIGGER_COMMENT" | awk '{print $2}')"
          ITERATION="$(jq -r '.iteration // 0' docs/agent-handoff/STATE.json)"
          MAX_ITERATIONS="$(jq -r '.maxIterations // 2' docs/agent-handoff/STATE.json)"

          if ! [[ "$ITERATION" =~ ^[0-9]+$ ]]; then ITERATION=0; fi
          if ! [[ "$MAX_ITERATIONS" =~ ^[0-9]+$ ]]; then MAX_ITERATIONS=2; fi
          if [ "$MAX_ITERATIONS" -gt 2 ]; then MAX_ITERATIONS=2; fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "completed=$COMPLETED" >> "$GITHUB_OUTPUT"
          echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$MAX_ITERATIONS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "RUN_CLAUDE" ] &&
             [ "$ACTIVE" != "$COMPLETED" ] &&
             [ "$COMMENT_ID" = "$ACTIVE" ] &&
             [ "$ITERATION" -ge 1 ] &&
             [ "$ITERATION" -le "$MAX_ITERATIONS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Claude authentication
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing repository secret CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Notify Claude start
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CLAUDE_WEBHOOK_URL }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_CLAUDE_WEBHOOK_URL is not configured"
            exit 0
          fi
          TEXT="🟣 *NARU Claude Code*\n実装を開始しました。\nInstruction: \`$INSTRUCTION_ID\`\nPR: #$PR_NUMBER\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the autonomous NARU implementation agent.

            First read:
            - AGENTS.md
            - docs/agent-handoff/README.md
            - docs/agent-handoff/STATE.json
            - docs/agent-handoff/NEXT_INSTRUCTION.md
            - docs/agent-handoff/REPORT.md

            Execute only the ACTIVE instruction in NEXT_INSTRUCTION.md.

            Hard rules:
            - Never edit NEXT_INSTRUCTION.md or STATE.json. ChatGPT owns those files.
            - You own REPORT.md and may edit implementation/test files required by the instruction.
            - If completedInstructionId in REPORT.md already equals the active instructionId, do not repeat the work.
            - Do not expose secrets or tokens.
            - Do not push to master/main.
            - Do not create or merge PRs or deploy production unless NEXT_INSTRUCTION.md explicitly authorizes it.
            - Do not call OpenAI APIs, Anthropic API-key billing, external paid generation APIs, or paid research APIs.
            - Use only this OAuth-authenticated Claude Code session plus repository tools and normal runner capabilities.
            - Prefer deterministic repository checks over extended discussion.
            - If a decision is unsafe or ambiguous, stop and set REPORT status to NEEDS_DECISION.
            - Preserve existing SEO Editor and Article Factory safety gates.
            - Run only the tests/checks explicitly requested by NEXT_INSTRUCTION.md or directly needed for the changed code.
            - Before finishing, replace docs/agent-handoff/REPORT.md with a concise complete report.

            REPORT.md must include:
            - reportId
            - completedInstructionId
            - status: DONE | NEEDS_DECISION | BLOCKED | FAILED | PR_READY
            - branch
            - summary
            - tests and timings
            - changed files
            - git diff summary
            - existing issues found
            - remaining risks
            - decisions needed
            - recommended next step

            Finish by leaving all intended changes in the working tree. The workflow will commit and push them.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Observer guard on Claude changes
        id: guard
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success'
        shell: bash
        run: |
          FILES="$(git diff --name-only)"
          COUNT="$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

          if printf '%s\n' "$FILES" | grep -Eq '^docs/agent-handoff/(STATE\.json|NEXT_INSTRUCTION\.md)$|^\.github/workflows/'; then
            echo "::error::Observer blocked a protected control-plane change"
            exit 1
          fi

          if [ "$COUNT" -gt 25 ]; then
            echo "::error::Observer blocked an unexpectedly large change set: $COUNT files"
            exit 1
          fi

          ADDED_LINES="$(git diff --unified=0 | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$ADDED_LINES" | grep -Eiq 'api\.openai\.com|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-ant-|sk-proj-'; then
            echo "::error::Observer blocked a metered-API credential or endpoint pattern"
            exit 1
          fi

          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "changed_files=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit and push Claude changes
        id: commit
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success' && steps.guard.outputs.safe == 'true'
        shell: bash
        run: |
          git config user.name "naru-agent-bot"
          git config user.email "naru-agent-bot@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "commit_sha=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "agent: execute handoff instruction"
          git push origin "HEAD:${{ steps.control.outputs.branch }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Claude completion
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success' && steps.guard.outcome == 'success' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CLAUDE_WEBHOOK_URL }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then exit 0; fi
          REPORT_STATUS="$(sed -n 's/^- status: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          [ -n "$REPORT_STATUS" ] || REPORT_STATUS="DONE"
          TEXT="✅ *NARU Claude Code*\n作業を終了しました。\nInstruction: \`$INSTRUCTION_ID\`\nReport: $REPORT_STATUS\nCommit: \`$COMMIT_SHA\`\nPR: #$PR_NUMBER\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"

  observer:
    needs: execute
    if: always() && needs.execute.outputs.gate_run == 'true' && needs.execute.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Alert NARU Observer
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_OBSERVER_WEBHOOK_URL }}
          RESULT: ${{ needs.execute.result }}
          INSTRUCTION_ID: ${{ needs.execute.outputs.active_instruction }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_OBSERVER_WEBHOOK_URL is not configured"
            exit 0
          fi
          TEXT="🚨 *NARU Observer*\n自動実行を停止しました。\nResult: \`$RESULT\`\nInstruction: \`$INSTRUCTION_ID\`\nPR: #$PR_NUMBER\n自動継続はしません。ChatGPT / 人間の確認が必要です。\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"
