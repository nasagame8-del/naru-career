name: NARU Agent Autopilot

on:
  issue_comment:
    types: [created]

concurrency:
  group: naru-agent-autopilot
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  execute:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@naru-autopilot ')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve control PR branch
        id: control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          test -n "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout control PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.control.outputs.branch }}
          fetch-depth: 0

      - name: Read autopilot state
        id: gate
        shell: bash
        env:
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
        run: |
          test -f docs/agent-handoff/NEXT_INSTRUCTION.md
          test -f docs/agent-handoff/STATE.json
          test -f docs/agent-handoff/REPORT.md
          test -f AGENTS.md

          STATUS="$(jq -r '.status // empty' docs/agent-handoff/STATE.json)"
          ACTIVE="$(jq -r '.instructionId // empty' docs/agent-handoff/STATE.json)"
          COMPLETED="$(sed -n 's/^- completedInstructionId: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          COMMENT_ID="$(printf '%s' "$TRIGGER_COMMENT" | awk '{print $2}')"
          MAX_TURNS="$(jq -r '.maxClaudeTurns // 4' docs/agent-handoff/STATE.json)"

          if ! [[ "$MAX_TURNS" =~ ^[0-9]+$ ]] || [ "$MAX_TURNS" -lt 1 ] || [ "$MAX_TURNS" -gt 8 ]; then
            MAX_TURNS=4
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "completed=$COMPLETED" >> "$GITHUB_OUTPUT"
          echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "RUN_CLAUDE" ] && [ "$ACTIVE" != "$COMPLETED" ] && [ "$COMMENT_ID" = "$ACTIVE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Claude authentication
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing repository secret CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the NARU implementation worker. ChatGPT is the orchestrator and reviewer.

            First read:
            - AGENTS.md
            - docs/agent-handoff/README.md
            - docs/agent-handoff/STATE.json
            - docs/agent-handoff/NEXT_INSTRUCTION.md
            - docs/agent-handoff/REPORT.md

            Execute only the ACTIVE instruction in NEXT_INSTRUCTION.md.

            Hard rules:
            - Never edit NEXT_INSTRUCTION.md or STATE.json. ChatGPT owns those files.
            - You own REPORT.md and may edit implementation/test files required by the instruction.
            - If completedInstructionId in REPORT.md already equals the active instructionId, do not repeat the work.
            - Do not expose secrets or tokens.
            - Do not push to master/main.
            - Do not create or merge PRs or deploy production unless NEXT_INSTRUCTION.md explicitly authorizes it.
            - If a decision is unsafe or ambiguous, stop and set REPORT status to NEEDS_DECISION.
            - Preserve existing SEO Editor and Article Factory safety gates.
            - Prefer reading existing code and running deterministic checks over extended discussion.
            - Do not call OpenAI APIs, Anthropic API-key billing, external paid generation APIs, or any paid research API. Use only this OAuth-authenticated Claude Code session plus repository tools and normal network access already available to the runner.
            - Do not start a second independent design exploration unless the first approach is blocked by evidence.
            - Run only the tests/checks explicitly requested by NEXT_INSTRUCTION.md or directly needed to verify changed code.
            - Before finishing, replace docs/agent-handoff/REPORT.md with a concise complete report.

            REPORT.md must include:
            - reportId
            - completedInstructionId
            - status: DONE | NEEDS_DECISION | BLOCKED | FAILED | PR_READY
            - branch
            - summary
            - tests and timings
            - changed files
            - git diff summary
            - existing issues found
            - remaining risks
            - decisions needed
            - recommended next step

            Finish by leaving all intended changes in the working tree. The workflow will commit and push them.
          claude_args: |
            --max-turns ${{ steps.gate.outputs.max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Commit and push Claude changes
        id: commit
        if: steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success'
        shell: bash
        run: |
          git config user.name "naru-agent-bot"
          git config user.email "naru-agent-bot@users.noreply.github.com"
          # Never stage workflow files: the GitHub token cannot push workflow changes.
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "agent: execute handoff instruction"
          git push origin "HEAD:${{ steps.control.outputs.branch }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post run summary to PR
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTIVE: ${{ steps.gate.outputs.active }}
          MAX_TURNS: ${{ steps.gate.outputs.max_turns }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          REPORT_STATUS="$(sed -n 's/^- status: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          [ -n "$REPORT_STATUS" ] || REPORT_STATUS="not-updated"
          [ -n "$COMMIT_SHA" ] || COMMIT_SHA="$(git rev-parse HEAD)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh pr comment "$PR_NUMBER" --body "NARU Claude run finished.

- instruction: `$ACTIVE`
- action outcome: `$CLAUDE_OUTCOME`
- report status: `$REPORT_STATUS`
- turn cap: `$MAX_TURNS`
- branch commit: `$COMMIT_SHA`
- Actions: $RUN_URL" || true
