name: NARU Agent Autopilot

on:
  issue_comment:
    types: [created]

concurrency:
  group: naru-agent-autopilot
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  execute:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@naru-autopilot ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gate_run: ${{ steps.gate.outputs.run }}
      active_instruction: ${{ steps.gate.outputs.active }}

    steps:
      - name: Resolve control PR branch
        id: control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          test -n "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout control PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.control.outputs.branch }}
          fetch-depth: 0

      - name: Read autopilot state
        id: gate
        shell: bash
        env:
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
        run: |
          test -f docs/agent-handoff/NEXT_INSTRUCTION.md
          test -f docs/agent-handoff/STATE.json
          test -f docs/agent-handoff/REPORT.md
          test -f AGENTS.md

          STATUS="$(jq -r '.status // empty' docs/agent-handoff/STATE.json)"
          ACTIVE="$(jq -r '.instructionId // empty' docs/agent-handoff/STATE.json)"
          COMPLETED="$(sed -n 's/^- completedInstructionId: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          COMMENT_ID="$(printf '%s' "$TRIGGER_COMMENT" | awk '{print $2}')"
          ITERATION="$(jq -r '.iteration // 0' docs/agent-handoff/STATE.json)"
          MAX_ITERATIONS="$(jq -r '.maxIterations // 2' docs/agent-handoff/STATE.json)"

          if ! [[ "$ITERATION" =~ ^[0-9]+$ ]]; then ITERATION=0; fi
          if ! [[ "$MAX_ITERATIONS" =~ ^[0-9]+$ ]]; then MAX_ITERATIONS=2; fi
          if [ "$MAX_ITERATIONS" -gt 2 ]; then MAX_ITERATIONS=2; fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "completed=$COMPLETED" >> "$GITHUB_OUTPUT"
          echo "iteration=$ITERATION" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$MAX_ITERATIONS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "RUN_CLAUDE" ] &&
             [ "$ACTIVE" != "$COMPLETED" ] &&
             [ "$COMMENT_ID" = "$ACTIVE" ] &&
             [ "$ITERATION" -ge 1 ] &&
             [ "$ITERATION" -le "$MAX_ITERATIONS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Claude authentication
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing repository secret CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Notify Claude start
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CLAUDE_WEBHOOK_URL }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_CLAUDE_WEBHOOK_URL is not configured"
            exit 0
          fi
          TEXT="🟣 *NARU Claude Code*\n実装を開始しました。\nInstruction: \`$INSTRUCTION_ID\`\nPR: #$PR_NUMBER\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the autonomous NARU implementation agent.

            First read:
            - AGENTS.md
            - docs/agent-handoff/README.md
            - docs/agent-handoff/STATE.json
            - docs/agent-handoff/NEXT_INSTRUCTION.md
            - docs/agent-handoff/REPORT.md

            Execute only the ACTIVE instruction in NEXT_INSTRUCTION.md.

            Hard rules:
            - Never edit NEXT_INSTRUCTION.md or STATE.json. ChatGPT owns those files.
            - You own REPORT.md and may edit implementation/test files required by the instruction.
            - If completedInstructionId in REPORT.md already equals the active instructionId, do not repeat the work.
            - Do not expose secrets or tokens.
            - Do not push to master/main.
            - Do not create or merge PRs or deploy production unless NEXT_INSTRUCTION.md explicitly authorizes it.
            - Do not call OpenAI APIs, Anthropic API-key billing, external paid generation APIs, or paid research APIs.
            - Use only this OAuth-authenticated Claude Code session plus repository tools and normal runner capabilities.
            - Prefer deterministic repository checks over extended discussion.
            - If a decision is unsafe or ambiguous, stop and set REPORT status to NEEDS_DECISION.
            - Preserve existing SEO Editor and Article Factory safety gates.
            - Run only the tests/checks explicitly requested by NEXT_INSTRUCTION.md or directly needed for the changed code.
            - Before finishing, replace docs/agent-handoff/REPORT.md with a concise complete report.\n            - REPORT.md must include a Japanese section headed exactly `## Slack reply` with the response that should be shown to the user in Slack (max 1200 characters).

            REPORT.md must include:
            - reportId
            - completedInstructionId
            - status: DONE | NEEDS_DECISION | BLOCKED | FAILED | PR_READY
            - branch
            - summary
            - tests and timings
            - changed files
            - git diff summary
            - existing issues found
            - remaining risks
            - decisions needed
            - recommended next step

            Finish by leaving all intended changes in the working tree. The workflow will commit and push them.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Post Claude response to Slack
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CLAUDE_WEBHOOK_URL }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then exit 0; fi

          THREAD_TS="$(sed -n 's/^- messageTs: `\([^`]*\)`.*/\1/p' docs/agent-handoff/NEXT_INSTRUCTION.md | head -n1)"
          CLAUDE_REPLY="$(awk '
            /^## Slack reply[[:space:]]*$/ {capture=1; next}
            /^## / && capture {exit}
            capture {print}
          ' docs/agent-handoff/REPORT.md | head -c 2400)"

          if [ -z "$CLAUDE_REPLY" ]; then
            CLAUDE_REPLY="Claudeの処理は完了しましたが、Slack向け回答をREPORTから取得できませんでした。REPORTを確認してください。"
          fi

          CLAUDE_REPLY="$(printf '%s' "$CLAUDE_REPLY" | sed -E 's/xox[baprs]-[A-Za-z0-9-]+/[redacted]/g; s/sk-[A-Za-z0-9_-]{12,}/[redacted]/g')"
          TEXT="🟣 *NARU Claude Code*\n$CLAUDE_REPLY\nPR: #$PR_NUMBER"
          jq -n --arg text "$TEXT" --arg thread "$THREAD_TS" '
            if $thread == "" then {text:$text} else {text:$text, thread_ts:$thread} end
          ' > /tmp/slack-claude-reply.json
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data @/tmp/slack-claude-reply.json "$SLACK_WEBHOOK"

      - name: Observer guard on Claude changes
        id: guard
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success'
        shell: bash
        run: |
          FILES="$(git diff --name-only)"
          COUNT="$(printf '%s\n' "$FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

          if printf '%s\n' "$FILES" | grep -Eq '^docs/agent-handoff/(STATE\.json|NEXT_INSTRUCTION\.md)$|^\.github/workflows/'; then
            echo "::error::Observer blocked a protected control-plane change"
            exit 1
          fi

          if [ "$COUNT" -gt 25 ]; then
            echo "::error::Observer blocked an unexpectedly large change set: $COUNT files"
            exit 1
          fi

          ADDED_LINES="$(git diff --unified=0 -- . ':(exclude)docs/agent-handoff/REPORT.md' | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$ADDED_LINES" | grep -Eiq 'api\.openai\.com|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-ant-|sk-proj-'; then
            echo "::error::Observer blocked a metered-API credential or endpoint pattern"
            exit 1
          fi

          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "changed_files=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit and push Claude changes
        id: commit
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success' && steps.guard.outputs.safe == 'true'
        shell: bash
        run: |
          git config user.name "naru-agent-bot"
          git config user.email "naru-agent-bot@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "commit_sha=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "agent: execute handoff instruction"
          git push origin "HEAD:${{ steps.control.outputs.branch }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Claude completion
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success' && steps.guard.outcome == 'success' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CLAUDE_WEBHOOK_URL }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then exit 0; fi
          REPORT_STATUS="$(sed -n 's/^- status: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"
          [ -n "$REPORT_STATUS" ] || REPORT_STATUS="DONE"
          TEXT="✅ *NARU Claude Code*\n作業を終了しました。\nInstruction: \`$INSTRUCTION_ID\`\nReport: $REPORT_STATUS\nCommit: \`$COMMIT_SHA\`\nPR: #$PR_NUMBER\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"

      - name: ChatGPT review and bounded second round
        if: always() && steps.gate.outputs.run == 'true' && steps.claude.outcome == 'success' && steps.guard.outcome == 'success' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_CHATGPT_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.issue.number }}
          INSTRUCTION_ID: ${{ steps.gate.outputs.active }}
          ITERATION: ${{ steps.gate.outputs.iteration }}
          MAX_ITERATIONS: ${{ steps.gate.outputs.max_iterations }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::ChatGPT review secrets are not fully configured"
            exit 0
          fi

          REPORT="$(head -c 12000 docs/agent-handoff/REPORT.md)"
          DIFF="$(git show --format= --no-ext-diff HEAD -- . ':(exclude)docs/agent-handoff/STATE.json' ':(exclude)docs/agent-handoff/NEXT_INSTRUCTION.md' | head -c 16000)"
          REPORT_STATUS="$(sed -n 's/^- status: `\([^`]*\)`.*/\1/p' docs/agent-handoff/REPORT.md | head -n1)"

          PROMPT="$(printf '%s\n'             'あなたはNARU War RoomのChatGPTレビュー担当です。'             'Claudeの実装結果を批判的に監査し、done / revise / human の3択で判断してください。'             'done: 実装・テストが妥当で追加修正不要。'             'revise: 明確で安全な修正点が残り、Claudeへもう1回だけ具体的な修正指示を出せる。'             'human: 認証情報、破壊的操作、merge/deploy、不可逆判断、仕様の曖昧さ、人間判断が必要。'             "現在のiteration: $ITERATION / $MAX_ITERATIONS"             'reviseならnext_instructionをClaudeがそのまま実行できる具体的指示にする。'             'merge/deployは承認しない。NARUの既存安全ゲートを維持する。Slack replyは日本語300文字以内。'             "Instruction: $INSTRUCTION_ID"             'REPORT:'             "$REPORT"             'DIFF:'             "$DIFF")"

          jq -n --arg model "gpt-6-luna" --arg input "$PROMPT" '{
            model: $model,
            input: $input,
            reasoning: {effort: "none"},
            max_output_tokens: 450,
            store: false,
            text: {
              verbosity: "low",
              format: {
                type: "json_schema",
                name: "naru_war_room_review",
                strict: true,
                schema: {
                  type: "object",
                  properties: {
                    decision: {type: "string", enum: ["done", "revise", "human"]},
                    slack_reply: {type: "string"},
                    next_instruction: {type: "string"}
                  },
                  required: ["decision", "slack_reply", "next_instruction"],
                  additionalProperties: false
                }
              }
            }
          }' > /tmp/openai-review.json

          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $OPENAI_API_KEY" -H 'Content-Type: application/json' --data @/tmp/openai-review.json https://api.openai.com/v1/responses > /tmp/openai-response.json

          REVIEW_JSON="$(jq -r '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/openai-response.json)"
          if [ -z "$REVIEW_JSON" ]; then
            echo "::warning::ChatGPT review returned no text"
            exit 0
          fi

          DECISION="$(printf '%s' "$REVIEW_JSON" | jq -r '.decision // "human"')"
          SLACK_REPLY="$(printf '%s' "$REVIEW_JSON" | jq -r '.slack_reply // "レビュー結果を取得できませんでした。"')"
          NEXT_INSTRUCTION="$(printf '%s' "$REVIEW_JSON" | jq -r '.next_instruction // ""')"

          case "$REPORT_STATUS" in
            NEEDS_DECISION|BLOCKED|FAILED)
              DECISION="human"
              ;;
          esac

          if ! [[ "$ITERATION" =~ ^[0-9]+$ ]]; then ITERATION=1; fi
          if ! [[ "$MAX_ITERATIONS" =~ ^[0-9]+$ ]]; then MAX_ITERATIONS=2; fi
          if [ "$MAX_ITERATIONS" -gt 2 ]; then MAX_ITERATIONS=2; fi

          FOLLOWUP=""
          if [ "$DECISION" = "revise" ] && [ "$ITERATION" -lt "$MAX_ITERATIONS" ] && [ -n "$NEXT_INSTRUCTION" ]; then
            NEXT_ITERATION=$((ITERATION + 1))
            NEXT_ID="${INSTRUCTION_ID}-R${NEXT_ITERATION}"
            PRIOR_CONTEXT="$(head -c 12000 docs/agent-handoff/NEXT_INSTRUCTION.md)"

            jq --arg id "$NEXT_ID" --argjson iteration "$NEXT_ITERATION" '.status = "RUN_CLAUDE" | .instructionId = $id | .iteration = $iteration | .nextWriter = "claude" | .notes = "ChatGPT requested one bounded revision round after reviewing Claude output."' docs/agent-handoff/STATE.json > /tmp/state.json
            mv /tmp/state.json docs/agent-handoff/STATE.json

            printf '%s\n'               '# Next Instruction'               ''               "- instructionId: \`$NEXT_ID\`"               '- issuedBy: `NARU ChatGPT review`'               '- target: `Claude Code`'               '- status: `ACTIVE`'               '- mode: `SLACK_LIVE_WAR_ROOM`'               "- iteration: \`$NEXT_ITERATION/$MAX_ITERATIONS\`"               ''               '## ChatGPT review'               ''               "$SLACK_REPLY"               ''               '## Required revision'               ''               "$NEXT_INSTRUCTION"               ''               '## Prior task context'               ''               "$PRIOR_CONTEXT"               ''               '## Hard boundaries'               ''               '- Challenge this review if it is technically wrong, but explain why in REPORT.'               '- Change only what is necessary for the required revision.'               '- Run relevant deterministic tests.'               '- Update REPORT.md and stop.'               '- Never edit STATE.json or NEXT_INSTRUCTION.md.'               '- Never push to master/main.'               '- Never merge or deploy production.'               '- Never expose secrets or introduce paid external APIs.'               > docs/agent-handoff/NEXT_INSTRUCTION.md

            git config user.name "naru-chatgpt-bot"
            git config user.email "naru-chatgpt-bot@users.noreply.github.com"
            git add docs/agent-handoff/STATE.json docs/agent-handoff/NEXT_INSTRUCTION.md
            git commit -m "agent: request bounded revision round"
            git push origin "HEAD:${{ steps.control.outputs.branch }}"

            gh pr comment "$PR_NUMBER" --body "@naru-autopilot $NEXT_ID"
            FOLLOWUP="\n🔁 Claudeへ自動で2回目の修正ラウンドを依頼しました。"
          elif [ "$DECISION" = "revise" ]; then
            DECISION="human"
            FOLLOWUP="\n⛔ 自動ラウンド上限に達したため、これ以上Claudeは自動起動しません。"
          fi

          if [ "$DECISION" = "done" ]; then
            ICON="✅"
          elif [ "$DECISION" = "human" ]; then
            ICON="👤"
          else
            ICON="🔁"
          fi

          THREAD_TS="$(sed -n 's/^- messageTs: `\([^`]*\)`.*/\1/p' docs/agent-handoff/NEXT_INSTRUCTION.md | head -n1)"
          TEXT="🟢 *NARU ChatGPT*\n$ICON Claudeの実装をレビューしました。\n$SLACK_REPLY$FOLLOWUP\nPR: #$PR_NUMBER"
          jq -n --arg text "$TEXT" --arg thread "$THREAD_TS" '
            if $thread == "" then {text:$text} else {text:$text, thread_ts:$thread} end
          ' > /tmp/slack-review.json
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data @/tmp/slack-review.json "$SLACK_WEBHOOK"

  observer:
    needs: execute
    if: always() && needs.execute.outputs.gate_run == 'true' && needs.execute.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Alert NARU Observer
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_OBSERVER_WEBHOOK_URL }}
          RESULT: ${{ needs.execute.result }}
          INSTRUCTION_ID: ${{ needs.execute.outputs.active_instruction }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_OBSERVER_WEBHOOK_URL is not configured"
            exit 0
          fi
          TEXT="🚨 *NARU Observer*\n自動実行を停止しました。\nResult: \`$RESULT\`\nInstruction: \`$INSTRUCTION_ID\`\nPR: #$PR_NUMBER\n自動継続はしません。ChatGPT / 人間の確認が必要です。\nActions: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$TEXT" '{text:$text}' > /tmp/slack.json
          curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             --data @/tmp/slack.json             "$SLACK_WEBHOOK"
