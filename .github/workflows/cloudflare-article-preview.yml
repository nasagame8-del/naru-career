name: NARU article Cloudflare preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
    paths:
      - "content/articles/**"
      - "public/images/articles/**"
      - "data/article-runs/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: naru-article-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Verify credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Detect single article
        id: article
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -t ARTICLES < <(
            git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- 'content/articles/*.md' |
            grep -E '^content/articles/[a-z0-9]+([a-z0-9-]*[a-z0-9])?\.md$' || true
          )

          if [ "${#ARTICLES[@]}" -ne 1 ]; then
            echo "::error::Cloudflare article preview requires exactly one changed article Markdown; found ${#ARTICLES[@]}"
            printf '%s\n' "${ARTICLES[@]}"
            exit 1
          fi

          ARTICLE_FILE="${ARTICLES[0]}"
          SLUG="$(basename "$ARTICLE_FILE" .md)"
          echo "file=$ARTICLE_FILE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Detected article: $SLUG"

      - name: Check four article images
        id: images
        shell: bash
        env:
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail
          MISSING=()
          for SLOT in card 01 02 03; do
            FILE="public/images/articles/$ARTICLE_SLUG-$SLOT.webp"
            [ -s "$FILE" ] || MISSING+=("$FILE")
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Preview deploy is waiting for all four WebP images:" >> "$GITHUB_STEP_SUMMARY"
            printf -- '- %s\n' "${MISSING[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.images.outputs.ready == 'true'

      - name: Build Cloudflare output
        if: steps.images.outputs.ready == 'true'
        run: npm run build:cloudflare

      - name: Prepare isolated read-only noindex preview
        if: steps.images.outputs.ready == 'true'
        env:
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const slug = process.env.ARTICLE_SLUG;
          const pr = process.env.PR_NUMBER;
          if (!slug || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) throw new Error('Invalid article slug');
          if (!pr || !/^\d+$/.test(pr)) throw new Error('Invalid PR number');

          const builtHtml = '.next/server/app/articles/' + slug + '.html';
          if (!fs.existsSync(builtHtml)) throw new Error('Built article HTML not found: ' + builtHtml);

          fs.copyFileSync(builtHtml, '.open-next/assets/__article-preview.html');
          fs.writeFileSync('.open-next/article-preview.js', `
          import worker from './worker.js';
          export default {...worker, async fetch(request, env, ctx) {
            const url = new URL(request.url);
            if (!['GET','HEAD'].includes(request.method) || /^\\/(api|internal|members|_workflow)(\\/|$)/.test(url.pathname))
              return new Response('Preview is read-only', {status:403, headers:{'X-Robots-Tag':'noindex, nofollow'}});
            const isAsset = url.pathname.startsWith('/_next/static/') || url.pathname.startsWith('/images/') || ['.ico','.png','.svg','.webp','.woff2'].some(ext => url.pathname.endsWith(ext));
            const articleRequest = url.pathname === '/articles/${slug}';
            const assetUrl = new URL('/__article-preview.html', url);
            const response = articleRequest ? await env.ASSETS.fetch(new Request(assetUrl, request)) : isAsset ? await env.ASSETS.fetch(request) : await worker.fetch(request, env, ctx);
            const result = new Response(response.body, response);
            result.headers.set('X-Robots-Tag', 'noindex, nofollow');
            return result;
          }};
          `);

          fs.writeFileSync('wrangler.article-preview.json', JSON.stringify({
            name: 'naru-pr-' + pr + '-preview',
            main: '.open-next/article-preview.js',
            compatibility_date: '2026-10-03',
            compatibility_flags: ['nodejs_compat'],
            workers_dev: true,
            assets: {directory: '.open-next/assets', binding: 'ASSETS', run_worker_first: true, html_handling: 'none'}
          }));
          NODE

      - name: Deploy isolated preview
        if: steps.images.outputs.ready == 'true'
        id: deploy
        shell: bash
        env:
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare deploy --config wrangler.article-preview.json 2>&1 | tee /tmp/article-preview.log
          URL="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' /tmp/article-preview.log | tail -n 1)"
          test -n "$URL"
          ARTICLE_URL="$URL/articles/$ARTICLE_SLUG"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "article_url=$ARTICLE_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $ARTICLE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Head SHA: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test article and noindex
        if: steps.images.outputs.ready == 'true'
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail
          STATUS="$(curl --retry 3 --retry-delay 3 -sS -D /tmp/preview-headers -o /tmp/preview-article.html -w '%{http_code}' "$URL/articles/$ARTICLE_SLUG")"
          echo "article status=$STATUS"
          sed -n '1,20p' /tmp/preview-headers
          echo "article bytes=$(wc -c < /tmp/preview-article.html | tr -d ' ')"
          head -c 240 /tmp/preview-article.html | tr '\n' ' '; echo
          test "$STATUS" = "200"
          grep -qi '<h1' /tmp/preview-article.html || { echo "::error::article HTML is missing <h1>"; exit 1; }
          grep -qi 'x-robots-tag: noindex' /tmp/preview-headers || { echo "::error::article response is missing X-Robots-Tag noindex"; exit 1; }
          for SLOT in card 01 02 03; do
            IMAGE_STATUS="$(curl -sS -o "/tmp/$SLOT.webp" -w '%{http_code}' "$URL/images/articles/$ARTICLE_SLUG-$SLOT.webp")"
            echo "$SLOT status=$IMAGE_STATUS bytes=$(wc -c < "/tmp/$SLOT.webp" | tr -d ' ')"
            test "$IMAGE_STATUS" = "200"
            test -s "/tmp/$SLOT.webp"
          done

      - name: Publish direct preview URL to PR
        if: steps.images.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE_URL: ${{ steps.deploy.outputs.article_url }}
          ARTICLE_SLUG: ${{ steps.article.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- naru-cloudflare-article-preview -->'
          BODY="$(printf '%s\n\n### Cloudflare article preview\n\n- Article: %s\n- Direct preview: %s\n- Head SHA: `%s`\n- Robots: `noindex, nofollow`\n' "$MARKER" "$ARTICLE_SLUG" "$ARTICLE_URL" "$HEAD_SHA")"
          COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- naru-cloudflare-article-preview -->")) | .id' | head -n1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
