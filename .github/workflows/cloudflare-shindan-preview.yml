name: NARU shindan Cloudflare preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths:
      - 'src/app/shindan/**'
      - 'public/shindan/**'
      - '.github/workflows/cloudflare-shindan-preview.yml'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: naru-shindan-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/app/shindan
      - run: npx vitest run src/app/shindan/_lib/matching.test.ts
      - run: npm run build:cloudflare
      - name: Prepare isolated read-only preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .open-next/assets/_next/static
          cp -a .next/static/. .open-next/assets/_next/static/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('.open-next/shindan-preview.js', `
          import worker from './worker.js';
          export default {...worker, async fetch(request, env, ctx) {
            const url = new URL(request.url);
            if (!['GET','HEAD'].includes(request.method) || /^\\/(api|internal|members|_workflow)(\\/|$)/.test(url.pathname))
              return new Response('Preview is read-only', {status:403, headers:{'X-Robots-Tag':'noindex, nofollow'}});
            const isAsset = url.pathname.startsWith('/_next/static/') || /\\.(ico|png|svg|webp|woff2?|otf|ttf)$/.test(url.pathname);
            const response = isAsset ? await env.ASSETS.fetch(request) : await worker.fetch(request, env, ctx);
            const result = new Response(response.body, response);
            result.headers.set('X-Robots-Tag','noindex, nofollow');
            return result;
          }};
          `);
          fs.writeFileSync('wrangler.shindan-preview.json', JSON.stringify({
            name:'naru-pr-'+process.env.PR_NUMBER+'-shindan-preview',
            main:'.open-next/shindan-preview.js',
            compatibility_date:'2026-10-03',
            compatibility_flags:['nodejs_compat'],
            workers_dev:true,
            assets:{directory:'.open-next/assets',binding:'ASSETS',run_worker_first:true}
          }));
          NODE
      - name: Deploy isolated preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.shindan-preview.json 2>&1 | tee /tmp/shindan-preview.log
          URL="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' /tmp/shindan-preview.log | tail -n1)"
          test -n "$URL"
          echo "url=$URL/shindan" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL/shindan (head $HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify diagnosis page and noindex
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail -sS -D /tmp/shindan-headers "$URL" -o /tmp/shindan.html
          grep -q '適職診断' /tmp/shindan.html
          grep -qi 'x-robots-tag: noindex' /tmp/shindan-headers
      - name: Attach direct preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf 'Cloudflare診断Preview: %s\n\nHead: `%s`\n\nnoindex・読み取り専用・本番とは独立。ユーザー確認までマージ禁止。\n' "$URL" "$HEAD_SHA" > /tmp/preview-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/preview-comment.md
