name: SEO No-API Validation

on:
  pull_request:
    paths:
      - "src/components/JsonLd.tsx"
      - "src/app/layout.tsx"
      - "src/app/page.tsx"
      - "src/lib/search-console.ts"
      - "src/lib/growth-lab.ts"
      - "src/lib/growth-lab.test.ts"
      - "src/lib/seo-opportunities.ts"
      - "src/lib/seo-opportunities.test.ts"
      - "src/lib/seo-editor/**"
      - "src/lib/naru-editor-agent/**"
      - "scripts/naru-editor-agent*"
      - "docs/naru-editor-agent-v1.md"
      - "src/app/internal/dashboard/gsc/**"
      - "src/app/api/gsc-snapshot/**"
      - "src/app/internal/dashboard/DashboardClient.tsx"
      - "src/app/internal/dashboard/growth/**"
      - "src/app/internal/api/route.ts"
      - "data/research-sources.json"
      - "data/research/source-status.json"
      - "scripts/research-watch.mjs"
      - ".github/workflows/research-watch.yml"
      - "src/types/search-console.ts"
      - "scripts/measure-seo-experiments.mjs"
      - "scripts/measure-seo-experiments.test.mjs"
      - "scripts/generate-popularity.mjs"
      - "scripts/generate-seo-opportunities.mjs"
      - "scripts/generate-gsc-daily-snapshot.mjs"
      - "scripts/lib/gsc-auth.mjs"
      - "package.json"
      - ".github/workflows/seo-no-api-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-no-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check GSC data scripts
        run: |
          node --check scripts/lib/gsc-auth.mjs
          node --check scripts/generate-gsc-daily-snapshot.mjs
          node --check scripts/generate-popularity.mjs
          node --check scripts/generate-seo-opportunities.mjs
          node --check scripts/measure-seo-experiments.mjs
          node --check scripts/research-watch.mjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DASHBOARD_PASSWORD: validation-only
          SEO_EDITOR_RUN_SIGNING_SECRET: validation-only
