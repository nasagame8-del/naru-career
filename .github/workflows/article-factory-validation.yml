name: Article Factory Validation

# 新規記事オートパイロットが作成したPRを外部CIで検証する。
#
# このジョブの成功が、記事PRの自動マージの必須条件になる。
# ワークフロー内のローカル判定（boolean）だけでマージすることはしない。

on:
  pull_request:
    paths:
      - "content/articles/**"
      - "public/images/articles/**"
      - "data/article-runs/**"

# 読み取り専用で十分。シークレットは使わない。
permissions:
  contents: read

concurrency:
  group: article-factory-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ワークフロー側はこのジョブ名でcheck-runを待つ。名前を変えないこと。
  article-factory-validation:
    name: article-factory-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect article slug
        id: article
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA")
          declare -A SLUGS=()

          for FILE in "${FILES[@]}"; do
            if [[ "$FILE" =~ ^content/articles/([a-z0-9]+([a-z0-9-]*[a-z0-9])?)\.md$ ]]; then
              SLUGS["${BASH_REMATCH[1]}"]=1
            elif [[ "$FILE" =~ ^public/images/articles/(.+)-(card|01|02|03)\.webp$ ]]; then
              SLUGS["${BASH_REMATCH[1]}"]=1
            fi
          done

          if [ "${#SLUGS[@]}" -gt 1 ]; then
            echo "::error::Article Factory PR must contain at most one article slug; found ${#SLUGS[@]}"
            printf '%s\n' "${!SLUGS[@]}"
            exit 1
          fi

          if [ "${#SLUGS[@]}" -eq 1 ]; then
            for SLUG in "${!SLUGS[@]}"; do
              echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
              echo "mode=article" >> "$GITHUB_OUTPUT"
              echo "Detected article: $SLUG"
            done
          else
            echo "mode=generic" >> "$GITHUB_OUTPUT"
            echo "No article slug changed; running generic repository validation."
          fi

      - name: Fact Check pre-scan
        if: steps.article.outputs.mode == 'article'
        run: npm run article:fact-check -- --slug "${{ steps.article.outputs.slug }}"

      - name: Full article local QA
        if: steps.article.outputs.mode == 'article'
        run: npm run article:local-qa -- --slug "${{ steps.article.outputs.slug }}"

      - name: Generic tests
        if: steps.article.outputs.mode == 'generic'
        run: npm test

      - name: Generic typecheck
        if: steps.article.outputs.mode == 'generic'
        run: npx tsc --noEmit

      - name: Generic build
        if: steps.article.outputs.mode == 'generic'
        run: npm run build
