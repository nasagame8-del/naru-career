name: NARU article Cloudflare preview cleanup

on:
  pull_request_target:
    types: [closed]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: naru-article-preview-cleanup-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PR_NUMBER"
          WORKER_NAME="naru-pr-${PR_NUMBER}-preview"
          STATUS="$(curl -sS -o /tmp/delete-worker.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME")"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            echo "Preview cleanup complete: $WORKER_NAME ($STATUS)"
          else
            cat /tmp/delete-worker.json
            echo "::error::Preview Worker cleanup failed with HTTP $STATUS"
            exit 1
          fi
