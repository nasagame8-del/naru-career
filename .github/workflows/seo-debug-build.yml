name: SEO Debug Build

on:
  push:
    branches:
      - feature/seo-quick-win-loop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Next build
        run: npm run build
        env:
          DASHBOARD_PASSWORD: debug-build-only
          SEO_EDITOR_RUN_SIGNING_SECRET: debug-build-only
