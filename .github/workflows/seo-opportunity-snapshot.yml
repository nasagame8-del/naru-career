name: SEO Opportunity Snapshot

on:
  schedule:
    # 07:35 JST (22:35 UTC previous day), before the 08:00 candidate selection.
    - cron: "35 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-opportunity-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Verify Search Console secrets
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL" || { echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_EMAIL"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" || { echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"; exit 1; }
          test -n "$SEARCH_CONSOLE_SITE_URL" || { echo "::error::Missing SEARCH_CONSOLE_SITE_URL"; exit 1; }

      - name: Refresh SEO data
        run: |
          npm run data:popularity
          npm run data:seo-opportunities

      - name: Commit snapshot when changed
        shell: bash
        run: |
          git config user.name "naru-seo-bot"
          git config user.email "naru-seo-bot@users.noreply.github.com"
          git add data/popularity.json data/seo-opportunities.json
          if git diff --cached --quiet; then
            echo "No SEO snapshot changes."
            exit 0
          fi
          git commit -m "data: refresh Search Console SEO snapshots"
          git push origin HEAD:master
