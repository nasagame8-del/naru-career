name: Cloudflare Runtime Diagnostic

on:
  push:
    branches:
      - infra/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://naru-career.broad-fuchsia.workers.dev
    steps:
      - name: Probe runtime routes
        shell: bash
        run: |
          set -u
          for path in             /internal/dashboard             /internal/api             /api/cron/article-candidates             /api/contact             /api/indexnow
          do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$BASE_URL$path" || true)"
            echo "$path -> $code"
            head -c 500 /tmp/body || true
            echo
          done
