name: Scaffold Cloudflare Workers

on:
  push:
    branches:
      - infra/cloudflare-workers

permissions:
  contents: write

jobs:
  scaffold:
    if: "!contains(github.event.head_commit.message, 'chore: scaffold Cloudflare Workers')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: infra/cloudflare-workers

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Add supported Cloudflare dependencies
        run: |
          npm install next@16.3.8 @opennextjs/cloudflare@1.20.8
          npm install --save-dev eslint-config-next@16.3.8 wrangler@latest
          npm pkg set scripts.build:cloudflare="opennextjs-cloudflare build"
          npm pkg set scripts.preview:cloudflare="opennextjs-cloudflare build && opennextjs-cloudflare preview"
          npm pkg set scripts.deploy:cloudflare="opennextjs-cloudflare build && opennextjs-cloudflare deploy"

      - name: Write OpenNext config
        shell: bash
        run: |
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";

          export default defineCloudflareConfig();
          EOF

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "naru-career",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-10-03",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          {
            echo "";
            echo "# Cloudflare / OpenNext";
            echo "/.open-next/";
            echo "/.wrangler/";
          } >> .gitignore

      - name: Verify permanent configuration
        run: |
          npm ci
          npm run build:cloudflare
          npx wrangler deploy --dry-run

      - name: Commit scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json open-next.config.ts wrangler.jsonc .gitignore
          if git diff --cached --quiet; then
            echo "No scaffold changes to commit."
            exit 0
          fi
          git commit -m "chore: scaffold Cloudflare Workers"
          git push origin HEAD:infra/cloudflare-workers
