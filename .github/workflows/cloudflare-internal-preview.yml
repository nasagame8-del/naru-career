name: NARU internal Cloudflare preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - "src/app/internal/**"
      - "src/lib/growth-lab*"
      - "data/research-sources.json"
      - "data/research/source-status.json"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: naru-internal-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_USER: preview
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Verify credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm ci

      - name: Build Cloudflare output
        env:
          DASHBOARD_USER: preview
          DASHBOARD_PASSWORD: preview-build-only
        run: npm run build:cloudflare

      - name: Ensure Next static assets are present in Cloudflare assets
        shell: bash
        run: |
          set -euo pipefail
          test -d .next/static
          mkdir -p .open-next/assets/_next/static
          cp -a .next/static/. .open-next/assets/_next/static/
          test -n "$(find .open-next/assets/_next/static -type f -name '*.css' -print -quit)"
          test -n "$(find .open-next/assets/_next/static -type f -name '*.js' -print -quit)"
          echo "css files=$(find .open-next/assets/_next/static -type f -name '*.css' | wc -l)"
          echo "js files=$(find .open-next/assets/_next/static -type f -name '*.js' | wc -l)"

      - name: Prepare isolated noindex internal preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_PASS="naru-preview-$PR_NUMBER"
          echo "PREVIEW_PASS=$PREVIEW_PASS" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('.open-next/internal-preview.js', `
          import worker from './worker.js';
          export default {...worker, async fetch(request, env, ctx) {
            const url = new URL(request.url);
            const isAsset =
              url.pathname.startsWith('/_next/static/') ||
              url.pathname.startsWith('/images/') ||
              ['.ico','.png','.svg','.webp','.woff2','.css','.js'].some(ext => url.pathname.endsWith(ext));

            const response = isAsset
              ? await env.ASSETS.fetch(request)
              : await worker.fetch(request, env, ctx);

            const result = new Response(response.body, response);
            result.headers.set('X-Robots-Tag', 'noindex, nofollow');
            return result;
          }};
          `);
          const pr = process.env.PR_NUMBER;
          const pass = 'naru-preview-' + pr;
          fs.writeFileSync('wrangler.internal-preview.json', JSON.stringify({
            name: 'naru-pr-' + pr + '-internal-preview',
            main: '.open-next/internal-preview.js',
            compatibility_date: '2026-10-03',
            compatibility_flags: ['nodejs_compat'],
            workers_dev: true,
            assets: {directory: '.open-next/assets', binding: 'ASSETS', run_worker_first: true},
            vars: {
              DASHBOARD_USER: 'preview',
              DASHBOARD_PASSWORD: pass,
              VERCEL_ENV: 'preview'
            }
          }));
          NODE

      - name: Deploy internal preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.internal-preview.json 2>&1 | tee /tmp/internal-preview.log
          URL="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' /tmp/internal-preview.log | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$URL/internal/dashboard" >> "$GITHUB_OUTPUT"

      - name: Smoke test dashboard and Growth Lab API
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=""
          for ATTEMPT in {1..12}; do
            STATUS="$(curl -sS -u "$PREVIEW_USER:$PREVIEW_PASS" -D /tmp/internal-headers -o /tmp/internal-dashboard.html -w '%{http_code}' "$URL/internal/dashboard" || true)"
            echo "dashboard attempt=$ATTEMPT status=$STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 5
          done
          test "$STATUS" = "200"
          test "$(wc -c < /tmp/internal-dashboard.html | tr -d ' ')" -gt 1000
          grep -qi 'x-robots-tag: noindex' /tmp/internal-headers

          CSS_PATH="$(grep -oE 'href="[^"]+\.css[^"]*"' /tmp/internal-dashboard.html | head -n1 | sed -E 's/^href="//; s/"$//' || true)"
          JS_PATH="$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/internal-dashboard.html | head -n1 | sed -E 's/^src="//; s/"$//' || true)"
          test -n "$CSS_PATH"
          test -n "$JS_PATH"

          CSS_STATUS="$(curl -sS -o /tmp/internal.css -w '%{http_code}' "$URL$CSS_PATH")"
          JS_STATUS="$(curl -sS -o /tmp/internal.js -w '%{http_code}' "$URL$JS_PATH")"
          echo "css=$CSS_PATH status=$CSS_STATUS bytes=$(wc -c < /tmp/internal.css | tr -d ' ')"
          echo "js=$JS_PATH status=$JS_STATUS bytes=$(wc -c < /tmp/internal.js | tr -d ' ')"
          test "$CSS_STATUS" = "200"
          test "$JS_STATUS" = "200"
          test "$(wc -c < /tmp/internal.css | tr -d ' ')" -gt 1000
          test "$(wc -c < /tmp/internal.js | tr -d ' ')" -gt 1000

          API_STATUS="$(curl -sS -u "$PREVIEW_USER:$PREVIEW_PASS" -o /tmp/internal-api.json -w '%{http_code}' "$URL/internal/api")"
          test "$API_STATUS" = "200"
          jq -e '.growthLab and .growthLab.internalLinks and .growthLab.aioScores and .growthLab.research' /tmp/internal-api.json >/dev/null
          echo "Growth Lab API smoke test passed"

      - name: Publish preview URL to PR
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_URL: ${{ steps.deploy.outputs.dashboard_url }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- naru-cloudflare-internal-preview -->'
          BODY="$(printf '%s\n\n### Cloudflare internal preview\n\n- Dashboard: %s\n- User: `%s`\n- Password: `%s`\n- Head SHA: `%s`\n- Robots: `noindex, nofollow`\n- Note: preview worker intentionally has no production Google OAuth secrets, so live GA4/GSC values may show as unconfigured. Growth Lab link/AIO/research sections are still rendered from repository data.\n' "$MARKER" "$DASHBOARD_URL" "$PREVIEW_USER" "$PREVIEW_PASS" "$HEAD_SHA")"
          COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- naru-cloudflare-internal-preview -->")) | .id' | head -n1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
